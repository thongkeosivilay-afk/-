<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ປະຫວັດເຕີມເງິນ</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="topup-history.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Noto+Sans+Lao+Looped:wght@600;700;800&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="shell">

  <!-- Header (ຄືກັນກັບໜ້າອື່ນ) -->
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L3 8L5 21H19L21 8L12 2Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 8L12 12L16 8" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name en"></span>
    </div>
    <button type="button" class="login-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"/></svg>
      <span>ລົງຊື່ເຂົ້າໃຊ້</span>
    </button>
  </header>

  <main class="th-main">

    <div class="th-title-row">
      <button type="button" class="th-back-btn" onclick="window.location.href='index.html'" aria-label="ກັບໄປໜ້າຫຼັກ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="display-lo">ປະຫວັດເຕີມເງິນ</h1>
    </div>
    <p class="th-sub">ເບິ່ງລາຍການເຕີມເງິນທັງໝົດຂອງທ່ານ</p>

    <!-- ---------- Stat cards ---------- -->
    <div class="th-stats">
      <div class="th-stat">
        <div class="th-stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          ລາຍການທັງໝົດ
        </div>
        <div class="th-stat-value" id="thStatTotal">0</div>
      </div>
      <div class="th-stat">
        <div class="th-stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>
          ສຳເລັດແລ້ວ
        </div>
        <div class="th-stat-value is-green" id="thStatDone">0</div>
      </div>
      <div class="th-stat">
        <div class="th-stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15.5 9.5c0-1.4-1.6-2.5-3.5-2.5s-3.5 1-3.5 2.3c0 3.2 7 1.5 7 4.7 0 1.3-1.6 2.3-3.5 2.3s-3.5-1.1-3.5-2.5"/></svg>
          ຍອດເຕີມລວມ
        </div>
        <div class="th-stat-value is-red" id="thStatAmount">0 ₭</div>
      </div>
    </div>

    <!-- ---------- List / loading / empty state ---------- -->
    <div id="thLoading" class="th-loading">ກຳລັງໂຫຼດ...</div>

    <div id="thEmpty" class="th-empty" style="display:none;">
      <div class="th-empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
      </div>
      <h2>ຍັງບໍ່ມີປະຫວັດການເຕີມເງິນ</h2>
      <p>ທ່ານຍັງບໍ່ເຄີຍເຕີມເງິນເຂົ້າລະບົບ</p>
      <button type="button" class="th-empty-btn" onclick="window.location.href='topup.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2a0a0a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        ເຕີມເງິນເລີຍ
      </button>
    </div>

    <div id="thList" class="th-list" style="display:none;"></div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="fname en"></div>
    <div class="fcopy">© 2026 <span class="fcopy-name en"></span> . ເວັບສ້າງໂດຍ BEERTJ . ຄວາມເປັນສ່ວນຕົວ</div>
  </footer>

  <!-- Chat FAB -->
  <button class="chat-fab" aria-label="Chat">
    <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

</div>
<script src="storefront-data.js"></script>
<script src="script.js"></script>
<script src="topup-history.js"></script>
</body>
</html>
