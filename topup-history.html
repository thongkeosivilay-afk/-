<!DOCTYPE html>

<html lang="lo">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ປະຫວັດເຕີມເງິນ</title>
<link href="style.css" rel="stylesheet"/>
<link href="topup-history.css" rel="stylesheet"/>
<link href="page-transition.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&amp;family=Noto+Sans+Lao+Looped:wght@600;700;800&amp;family=Orbitron:wght@600;700;800;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
</head>
<body>
<div class="shell">
<!-- Header (ຄືກັນກັບໜ້າອື່ນ) -->
<header>
<div class="brand">
<div class="logo has-custom-logo">
<img alt="logo" src="assets/logo.png"/>
</div>
<span class="brand-name en"></span>
</div>
<button class="login-btn" type="button">
<svg fill="currentColor" viewbox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"></path></svg>
<span>ລົງຊື່ເຂົ້າໃຊ້</span>
</button>
</header>
<main class="th-main">
<div class="th-title-row">
<button aria-label="ກັບໄປໜ້າຫຼັກ" class="th-back-btn" data-nav-href="index.html" type="button">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<h1 class="display-lo">ປະຫວັດເຕີມເງິນ</h1>
</div>
<p class="th-sub">ເບິ່ງລາຍການເຕີມເງິນທັງໝົດຂອງທ່ານ</p>
<!-- ---------- Stat cards ---------- -->
<div class="th-stats">
<div class="th-stat">
<div class="th-stat-head">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect height="4" rx="1" width="8" x="8" y="2"></rect></svg>
          ລາຍການທັງໝົດ
        </div>
<div class="th-stat-value" id="thStatTotal">0</div>
</div>
<div class="th-stat">
<div class="th-stat-head">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="8 12 11 15 16 9"></polyline></svg>
          ສຳເລັດແລ້ວ
        </div>
<div class="th-stat-value is-green" id="thStatDone">0</div>
</div>
<div class="th-stat">
<div class="th-stat-head">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v12M15.5 9.5c0-1.4-1.6-2.5-3.5-2.5s-3.5 1-3.5 2.3c0 3.2 7 1.5 7 4.7 0 1.3-1.6 2.3-3.5 2.3s-3.5-1.1-3.5-2.5"></path></svg>
          ຍອດເຕີມລວມ
        </div>
<div class="th-stat-value is-red" id="thStatAmount">0 ₭</div>
</div>
</div>
<!-- ---------- List / loading / empty state ---------- -->
<div class="th-loading" id="thLoading">ກຳລັງໂຫຼດ...</div>
<div class="th-empty u-hidden" id="thEmpty">
<div class="th-empty-icon">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="14" rx="2.5" width="20" x="2" y="6"></rect><path d="M2 10h20"></path><path d="M6 15h4"></path></svg>
</div>
<h2>ຍັງບໍ່ມີປະຫວັດການເຕີມເງິນ</h2>
<p>ທ່ານຍັງບໍ່ເຄີຍເຕີມເງິນເຂົ້າລະບົບ</p>
<button class="th-empty-btn" data-nav-href="topup.html" type="button">
<svg fill="none" height="16" stroke="#2a0a0a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="16"><line x1="12" x2="12" y1="5" y2="19"></line><line x1="5" x2="19" y1="12" y2="12"></line></svg>
        ເຕີມເງິນເລີຍ
      </button>
</div>
<div class="th-list u-hidden" id="thList"></div>
</main>
<!-- Footer -->
<footer>
<div class="footer-logo logo"></div>
<div class="fname en"></div>
<div class="fsocial" id="footer-social"></div>
<div class="fcopy">© 2026 <span class="fcopy-name en"></span> . ຄວາມເປັນສ່ວນຕົວ</div>
</footer>
<!-- Chat FAB -->
<button aria-label="Chat" class="chat-fab">
<svg fill="none" viewbox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
</button>
</div>
<script src="page-transition.js"></script>
<script src="nav-links.js"></script>
<script src="storefront-data.js"></script>
<script src="script.js"></script>
<script src="topup-history.js"></script>
</body>
</html>
