name = "dek-mash-shop"
main = "src/index.js"
compatibility_date = "2026-01-01"

# โฟลเดอร์ที่เก็บไฟล์ static เดิม (index.html, style.css, script.js)
# ให้ก็อปไฟล์เว็บทั้งหมดของทีมมาไว้ในโฟลเดอร์ "public" ก่อน deploy
[assets]
directory = "./public"
binding = "ASSETS"

# session storage — สร้างด้วยคำสั่ง:
#   wrangler kv namespace create SESSIONS
# แล้วเอา id ที่ได้มาแทนที่ "REPLACE_WITH_YOUR_KV_ID" ข้างล่างนี้
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_YOUR_KV_ID"

# DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET ไม่ใส่ไว้ในไฟล์นี้
# ให้ตั้งผ่านคำสั่ง (ดูขั้นตอนใน DISCORD_LOGIN_SETUP.md):
#   wrangler secret put DISCORD_CLIENT_ID
#   wrangler secret put DISCORD_CLIENT_SECRET
