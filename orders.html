<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ປະຫວັດການສັ່ງຊື້</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="orders.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Noto+Sans+Lao+Looped:wght@600;700;800&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="shell">

  <!-- Header (ຄືກັນກັບໜ້າອື່ນ) -->
  <header>
    <div class="brand">
      <div class="logo has-custom-logo">
        <img src="assets/logo.png" alt="logo">
      </div>
      <span class="brand-name en"></span>
    </div>
    <button type="button" class="login-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"/></svg>
      <span>ລົງຊື່ເຂົ້າໃຊ້</span>
    </button>
  </header>

  <main class="oh-main">

    <div class="oh-title-row">
      <button type="button" class="oh-back-btn" onclick="window.location.href='index.html'" aria-label="ກັບໄປໜ້າຫຼັກ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="display-lo">ປະຫວັດການສັ່ງຊື້</h1>
    </div>
    <p class="oh-sub">ລາຍການສັ່ງຊື້ ແລະ ສະຖານະສິນຄ້າຂອງທ່ານ</p>

    <!-- ---------- Stat cards ---------- -->
    <div class="oh-stats">
      <div class="oh-stat">
        <div class="oh-stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7L12 3 4 7l8 4 8-4Z"/><path d="M4 7v10l8 4 8-4V7"/></svg>
          ລາຍການທັງໝົດ
        </div>
        <div class="oh-stat-value" id="ohStatTotal">0</div>
      </div>
    </div>

    <!-- ---------- List / loading / empty state ---------- -->
    <div id="ohLoading" class="oh-loading">ກຳລັງໂຫຼດ...</div>

    <div id="ohEmpty" class="oh-empty" style="display:none;">
      <div class="oh-empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </div>
      <h2>ຍັງບໍ່ມີປະຫວັດການສັ່ງຊື້</h2>
      <p>ເລີ່ມຕົ້ນຊື້ສິນຄ້າໄດ້ເລີຍ!</p>
      <button type="button" class="oh-empty-btn" onclick="window.location.href='index.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2a0a0a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12L6 6Z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        ໄປທີ່ຮ້ານຄ້າ
      </button>
    </div>

    <div id="ohList" class="oh-list" style="display:none;"></div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="fname en"></div>
    <div class="fcopy">© 2026 <span class="fcopy-name en"></span> . ເວັບສ້າງໂດຍ BEERTJ . ຄວາມເປັນສ່ວນຕົວ</div>
  </footer>

  <!-- Chat FAB -->
  <button class="chat-fab" aria-label="Chat">
    <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

</div>
<script src="storefront-data.js"></script>
<script src="script.js"></script>
<script src="orders.js"></script>
</body>
</html>
