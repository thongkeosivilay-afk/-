<head>

<title>ຈັດອັນດັບຍອດເຕີມ</title>

<link href="leaderboard.css" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Noto+Sans+Lao+Looped:wght@600;700;800&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>

</head>
<body>
<div class="lb-cover" id="lbCover" aria-hidden="true"></div>

<div class="shell">

<!-- Header (เหมือนหน้าอื่น — ปุ่มโปรไฟล์เปิดแถบเมนูด้านล่าง) -->
<header>
<div class="brand">
<div class="logo has-custom-logo"><img alt="logo" src="assets/logo.png"/></div>
<span class="brand-name en"></span>
</div>
<button class="login-btn" type="button">
<svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"></path></svg>
<span>ລົງຊື່ເຂົ້າໃຊ້</span>
</button>
</header>

  <main class="lb-main">

    <!-- Title -->
    <section class="lb-title">
      <span class="eyebrow-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></svg>
        TOP SPENDERS
        <span class="live-tag" id="lbLive"><i></i>LIVE</span>
      </span>
      <h1>ຈັດອັນດັບຍອດເຕີມ</h1>
      <p>10 ອັນດັບຜູ້ສະໜັບສະໜູນຍອດເຕີມເງິນສະສົມສູງສຸດ</p>
    </section>

    <!-- Top 3 -->
    <section class="top3" id="top3"></section>

    <!-- Divider -->
    <div class="rank-divider"><span>ອັນດັບ 4 - 10</span></div>

    <!-- Rank 4-10 -->
    <section class="rest" id="rest"></section>
  </main>

<footer>
<div class="footer-logo logo"></div>
<div class="fname en"></div>
<div class="fsocial" id="footer-social"></div>
<div class="fcopy">© 2026 <span class="fcopy-name en"></span> . ຄວາມເປັນສ່ວນຕົວ</div>
</footer>

<!-- Chat FAB -->
<button aria-label="Chat" class="chat-fab">
<svg fill="none" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
</button>
</div>

</html>
