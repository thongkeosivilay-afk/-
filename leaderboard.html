<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>จัดอันดับยอดเติม</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="leaderboard.css" rel="stylesheet"/>
</head>
<body>
<div class="lb-cover" id="lbCover" aria-hidden="true"></div>

<div class="lb-shell">

  <!-- Ticker -->
  <div class="ticker" aria-label="ประกาศ">
    <div class="ticker-track">
      <span class="ticker-item">อันดับ 1 ในไทย</span>
      <span class="ticker-item"><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>ยินดีต้อนรับสู่ร้านค้าขายสินค้าโปรแกรมช่วยเล่นหลายเกม</span>
      <span class="ticker-item">อันดับ 1 ในไทย</span>
      <span class="ticker-item"><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>ยินดีต้อนรับสู่ร้านค้าขายสินค้าโปรแกรมช่วยเล่นหลายเกม</span>
    </div>
  </div>

  <!-- Header -->
  <div class="hdr-wrap">
    <div class="hdr" id="hdr">
      <a class="hdr-logo" href="index.html" aria-label="หน้าแรก"><img src="assets/logo.png" alt="logo"/></a>
      <div class="hdr-right">
        <button class="hdr-discord" type="button" aria-label="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        </button>
        <div class="hdr-coin">
          <span class="coin-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7a2 2 0 0 1 2-2h11a1 1 0 0 1 0 2H6v.2h12a2 2 0 0 1 2 2V11h-4a2.5 2.5 0 0 0 0 5h4v1.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/><circle cx="16.2" cy="13.5" r="1.1"/></svg></span>
          <span class="coin-amt" id="coinAmt">0.00</span><span class="coin-txt">COIN</span>
        </div>
        <button class="hdr-avatar" type="button" aria-label="โปรไฟล์">
          <svg class="crown" viewBox="0 0 24 16"><path d="M2 14 1 4l6 5 5-8 5 8 6-5-1 10Z" fill="#f2b632"/><path d="M2 14h20v2H2z" fill="#c98a12"/></svg>
          <span class="av-ring"><b>M</b></span>
        </button>
        <button class="hdr-menu" type="button" aria-label="เมนู">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
        </button>
      </div>
    </div>
  </div>

  <main class="lb-main">

    <!-- Title -->
    <section class="lb-title">
      <span class="eyebrow-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></svg>
        TOP SPENDERS
      </span>
      <h1>จัดอันดับยอดเติม</h1>
      <p>10 อันดับผู้สนับสนุนยอดเติมเงินสะสมสูงสุด</p>
    </section>

    <!-- Top 3 -->
    <section class="top3" id="top3"></section>

    <!-- Divider -->
    <div class="rank-divider"><span>อันดับ 4 - 10</span></div>

    <!-- Rank 4-10 -->
    <section class="rest" id="rest"></section>
  </main>

  <footer class="lb-footer"></footer>

  <button aria-label="Chat" class="chat-fab" type="button">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2.5 6.6 2.5 11.2c0 2.5 1.2 4.7 3.2 6.2-.2 1.2-.8 2.4-1.7 3.3-.2.3 0 .8.4.7 1.9-.3 3.5-1.1 4.6-1.9.9.2 1.9.3 3 .3 5.5 0 9.5-3.6 9.5-8.6S17.500 3 12 3Z"/><circle cx="8" cy="11.2" r="1.15" fill="#990001"/><circle cx="12" cy="11.2" r="1.15" fill="#990001"/><circle cx="16" cy="11.2" r="1.15" fill="#990001"/></svg>
    <span class="chat-badge">0</span>
  </button>
</div>

<script src="leaderboard.js"></script>
</body>
</html>
