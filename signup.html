<!DOCTYPE html>

<html lang="lo">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ສະໝັກສະມາຊິກ</title>
<link href="auth.css" rel="stylesheet"/>
<link href="page-transition.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&amp;family=Noto+Sans+Lao+Looped:wght@600;700;800&amp;family=Orbitron:wght@600;700;800;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
</head>
<body>
<div class="auth-shell">
<a class="auth-back" href="index.html">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
    ກັບໜ້າຫຼັກ
  </a>
<div class="auth-crest">
<div class="auth-crest-inner">
<img alt="logo" src="assets/logo.png"/>
</div>
</div>
<div class="auth-brand en"></div>
<div class="auth-tagline">ສ້າງບັນຊີໃໝ່ ໃຊ້ເວລາບໍ່ເຖິງນາທີ</div>
<div class="auth-card-wrap">
<div class="auth-card">
<div class="auth-card-title">ສະໝັກສະມາຊິກ</div>
<div class="auth-card-sub">ສ້າງບັນຊີເພື່ອເລີ່ມສັ່ງຊື້ ແລະ ຮັບໂປຣໂມຊັ່ນພິເສດ</div>
<form id="signup-form" novalidate="">
<div class="field" id="signup-username-field">
<label for="signup-username">ຊື່ຜູ້ໃຊ້</label>
<div class="field-input">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a8 8 0 0 1 16 0v1"></path></svg>
<input autocomplete="username" id="signup-username" placeholder="ຊື່ທີ່ໃຊ້ໃນລະບົບ" required="" type="text"/>
</div>
<div class="field-error"></div>
</div>
<div class="field" id="signup-email-field">
<label for="signup-email">ອີເມວ</label>
<div class="field-input">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="14" rx="2" width="18" x="3" y="5"></rect><path d="m3 7 9 6 9-6"></path></svg>
<input autocomplete="email" id="signup-email" placeholder="you@example.com" required="" type="email"/>
</div>
<div class="field-error"></div>
</div>
<div class="field" id="signup-password-field">
<label for="signup-password">ລະຫັດຜ່ານ</label>
<div class="field-input">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="9" rx="2" width="16" x="4" y="11"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<input autocomplete="new-password" id="signup-password" placeholder="ຢ່າງໜ້ອຍ 6 ໂຕ" required="" type="password"/>
<button aria-label="ສະແດງລະຫັດຜ່ານ" class="field-toggle" type="button">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<div class="field-error"></div>
</div>
<div class="field" id="signup-password2-field">
<label for="signup-password2">ຢືນຢັນລະຫັດຜ່ານ</label>
<div class="field-input">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="9" rx="2" width="16" x="4" y="11"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<input autocomplete="new-password" id="signup-password2" placeholder="ພິມລະຫັດຜ່ານອີກຄັ້ງ" required="" type="password"/>
<button aria-label="ສະແດງລະຫັດຜ່ານ" class="field-toggle" type="button">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<div class="field-error"></div>
</div>
<div class="field-row u-flex-start">
<label class="check-row">
<input id="signup-terms" type="checkbox"/>
            ຂ້ອຍຍອມຮັບ <a class="link-muted u-ml-4" href="#">ເງື່ອນໄຂການນຳໃຊ້</a>
</label>
</div>
<button class="btn-block btn-submit" type="submit">ສ້າງບັນຊີ</button>
</form>
<div class="divider">ຫຼື</div>
<button class="btn-block btn-discord" type="button">
<svg fill="currentColor" viewbox="0 0 24 24"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.9-1.52.07.07 0 0 0-.08.04c-.21.38-.45.86-.61 1.24a18.3 18.3 0 0 0-5.46 0 12.6 12.6 0 0 0-.62-1.24.08.08 0 0 0-.08-.04c-1.7.29-3.34.8-4.9 1.52a.07.07 0 0 0-.03.03C.53 8.7-.32 12.9.1 17.06a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 6 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.3 1.23-2a.08.08 0 0 0-.04-.11 13 13 0 0 1-1.87-.9.08.08 0 0 1 0-.13c.13-.09.25-.19.37-.28a.07.07 0 0 1 .08 0c3.93 1.8 8.18 1.8 12.06 0a.07.07 0 0 1 .08 0c.12.1.24.19.37.28a.08.08 0 0 1 0 .13c-.6.35-1.22.65-1.87.9a.08.08 0 0 0-.04.12c.37.7.78 1.36 1.23 2a.08.08 0 0 0 .08.02 19.8 19.8 0 0 0 6.01-3.03.08.08 0 0 0 .03-.05c.5-4.83-.83-9-3.51-12.66a.06.06 0 0 0-.03-.03ZM8.02 14.6c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.21 0 2.17 1.1 2.15 2.42 0 1.34-.95 2.42-2.15 2.42Zm7.97 0c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.21 0 2.17 1.1 2.15 2.42 0 1.34-.94 2.42-2.15 2.42Z"></path></svg>
        ສະໝັກດ້ວຍ Discord
      </button>
<button class="btn-block btn-google" type="button">
<svg viewbox="0 0 48 48"><path d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.1 17.7 9.5 24 9.5Z" fill="#EA4335"></path><path d="M46.5 24.5c0-1.6-.1-3.1-.4-4.6H24v9h12.6c-.5 3-2.2 5.5-4.7 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-17.3Z" fill="#4285F4"></path><path d="M10.5 19.3a14.5 14.5 0 0 0 0 9.3l-7.9 6.1a24 24 0 0 1 0-21.5l7.9 6.1Z" fill="#FBBC05"></path><path d="M24 48c6.1 0 11.3-2 15-5.5l-7.4-5.7c-2.1 1.4-4.7 2.2-7.6 2.2-6.3 0-11.6-3.6-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48Z" fill="#34A853"></path></svg>
        ສະໝັກດ້ວຍ Google
      </button>
</div>
</div>
<div class="auth-switch">ມີບັນຊີແລ້ວ? <a href="login.html">ລົງຊື່ເຂົ້າໃຊ້</a></div>
<div class="auth-terms">ການດຳເນີນການຕໍ່ ຖືວ່າທ່ານຍອມຮັບ <a href="#">ເງື່ອນໄຂການນຳໃຊ້</a> ແລະ <a href="#">ນະໂຍບາຍຄວາມເປັນສ່ວນຕົວ</a></div>
</div>
<script src="page-transition.js"></script>
<script src="storefront-data.js"></script>
<script src="auth.js"></script>
</body>
</html>
