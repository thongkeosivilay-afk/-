<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ໝວດໝູ່ສິນຄ້າ</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Noto+Sans+Lao+Looped:wght@600;700;800&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L3 8L5 21H19L21 8L12 2Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 8L12 12L16 8" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name en"></span>
    </div>
    <button type="button" class="login-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"/></svg>
      <span>ລົງຊື່ເຂົ້າໃຊ້</span>
    </button>
  </header>

  <!-- Back link -->
  <a class="page-back" href="index.html#categories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    ກັບໄປເລືອກໝວດໝູ່
  </a>

  <!-- Category title / description (filled in by category.js) -->
  <section class="cat-page-head">
    <h1 class="cat-page-title display-lo" id="cat-title">ໝວດໝູ່ສິນຄ້າ</h1>
    <p class="cat-page-desc" id="cat-desc"></p>
  </section>

  <!-- Search within this category -->
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="search-input" placeholder="ຄົ້ນຫາສິນຄ້າ...">
  </div>

  <!-- Product grid: populated for the current category only -->
  <div class="prod-grid" id="prod-grid"></div>

  <!-- Shown when the category has no products yet -->
  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 7L12 3 4 7l8 4 8-4Z"/><path d="M4 7v10l8 4 8-4V7"/></svg>
    <p>ຍັງບໍ່ມີສິນຄ້າໃນໝວດນີ້<br>ກະລຸນາກັບມາເບິ່ງພາຍຫຼັງ</p>
  </div>

  <!-- Footer -->
  <footer>
    <div class="fname en"></div>
    <div class="fcopy">© 2026 <span class="fcopy-name en"></span> . ເວັບສ້າງໂດຍ BEERTJ . ຄວາມເປັນສ່ວນຕົວ</div>
  </footer>

  <!-- Chat FAB -->
  <button class="chat-fab" aria-label="Chat">
    <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

</div>
<!-- storefront-data.js: ດຶງຂໍ້ມູນຮ້ານຈິງ (ໝວດໝູ່/ສິນຄ້າ/ສະຕັອກ) ຈາກ /api/public/storefront,
                        ໃຊ້ຮ່ວມກັນກັບ index.html
     category.js: ອ່ານ ?cat= ຈາກ URL, ດຶງ+ສ້າງກາຕູນສິນຄ້າຈິງ, ຄຸມການຄົ້ນຫາ/ປຸ່ມຊື້ ດ້ວຍຕົນເອງ
     script.js: login-state / chat fab / interaction ອື່ນໆຂອງໜ້າ -->
<script src="storefront-data.js"></script>
<script src="category.js"></script>
<script src="script.js"></script>
</body>
</html>
